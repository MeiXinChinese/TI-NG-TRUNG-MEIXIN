<head>

<title>NGỮ PHÁP HSK2 3.0 · TIẾNG TRUNG MEIXIN</title>
<style>
  :root{
    --bg:#FFF7D6;
    --card:#FFFFFF;
    --accent:#FF9F43;
    --accent2:#FF6B6B;
    --accent3:#4D96FF;
    --accent4:#6BCB77;
    --text:#3A2E1F;
    --muted:#8a7a55;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#FFD166,#FFB84D); padding:26px 20px 20px; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.08); position:relative;
  }
  header a.back-link{
    position:absolute; left:16px; top:16px; font-size:13px; color:#7a4300; text-decoration:none; font-weight:700;
  }
  header h1{ margin:0; font-size:26px; color:#5a3d1a; }
  header p{ margin:6px 0 0; font-size:14px; color:#6b4a1c; }

  .toc-bar{
    position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:2px dashed #f0d98a;
    padding:12px 16px; display:flex; gap:8px; overflow-x:auto; white-space:nowrap;
  }
  .toc-bar a{
    display:inline-block; background:#fff; color:#8a6d2e; font-size:12.5px; font-weight:700;
    padding:7px 13px; border-radius:16px; text-decoration:none; box-shadow:0 2px 6px rgba(0,0,0,.06);
    flex-shrink:0;
  }
  .toc-bar a:hover{ background:var(--accent); color:#fff; }

  main{ max-width:880px; margin:0 auto; padding:20px 16px 40px; }

  .topic-block{
    scroll-margin-top:64px; margin-bottom:44px; padding-bottom:20px; border-bottom:3px dashed #f0d98a;
  }
  .topic-num{
    display:inline-block; background:var(--accent2); color:#fff; font-weight:800; font-size:13px;
    padding:4px 12px; border-radius:14px; margin-bottom:8px;
  }
  .topic-title{ font-size:21px; font-weight:800; color:#8a4b00; margin:0 0 14px; }

  .explain-card{
    background:var(--card); border-radius:16px; padding:16px 20px; box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:16px;
  }
  .explain-card p{ margin:0 0 10px; font-size:14.5px; line-height:1.6; }
  .explain-card ul{ margin:6px 0; padding-left:20px; font-size:14px; }
  .formula{
    background:#FFEFD5; border-radius:10px; padding:10px 14px; text-align:center; font-size:16px; font-weight:700;
    color:#8a4b00; margin:10px 0;
  }
  .example-line{ padding:6px 0; border-bottom:1px dashed #eee2b8; }
  .example-line:last-child{ border-bottom:none; }
  .example-line .cn{ font-size:16px; font-weight:600; }
  .example-line .py{ color:var(--muted); font-size:12.5px; }
  .example-line .vn{ color:#444; font-size:13.5px; }

  .ex-box{
    background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 3px 10px rgba(0,0,0,.07);
  }
  .ex-box h4{ margin:0 0 4px; color:#8a4b00; font-size:14.5px; }
  .ex-box .ex-desc{ color:var(--muted); font-size:12.5px; margin-bottom:10px; }

  /* Sentence order */
  .chip-bank, .chip-answer{ display:flex; flex-wrap:wrap; gap:8px; min-height:42px; padding:8px; border-radius:10px; }
  .chip-bank{ background:#FDEBC8; }
  .chip-answer{ background:#fff; border:2px dashed #e0c073; }
  .chip{
    background:var(--accent3); color:#fff; padding:7px 11px; border-radius:8px; cursor:pointer; font-size:15px;
    text-align:center; line-height:1.1; user-select:none;
  }
  .chip .py-tag{ display:block; font-size:9.5px; opacity:.85; }
  .chip.used{ opacity:.35; pointer-events:none; }
  .task-controls{ margin-top:8px; display:flex; gap:8px; }
  .btn{
    background:var(--accent); color:#fff; border:none; padding:7px 15px; border-radius:18px; cursor:pointer;
    font-weight:600; font-size:12.5px;
  }
  .btn.secondary{ background:#ccc; color:#444; }
  .feedback{ margin-top:6px; font-weight:700; font-size:13px; }
  .feedback.ok{ color:#2e9e44; }
  .feedback.no{ color:#e04b4b; }

  /* translate / dat cau */
  .ex-box textarea, .ex-box input[type=text]{
    width:100%; border:2px solid #e0c073; border-radius:10px; padding:8px 10px; font-size:15px;
    font-family:inherit; box-sizing:border-box; margin-bottom:8px; resize:vertical;
  }
  .sample-answer{
    background:#FFF9E6; border-radius:8px; padding:8px 10px; font-size:13.5px; margin-top:6px; display:none;
  }
  .sample-answer.show{ display:block; }

  /* fill blank */
  .wordbank-chip{
    background:#FFE8B8; color:#8a4b00; padding:6px 12px; border-radius:8px; font-size:14px; font-weight:700;
  }
  .fill-item{ margin-bottom:12px; background:#FFF9E6; border-radius:10px; padding:10px 12px; }
  .fill-item .fill-sentence{ font-size:15px; margin-bottom:4px; }
  .fill-item .fill-sentence input{
    border:2px solid #e0c073; border-radius:8px; padding:4px 8px; font-size:14px; width:90px; text-align:center; margin:0 4px;
  }
  .fill-item .fill-vn{ font-size:12.5px; color:var(--muted); font-style:italic; }

  /* matching */
  .match-wrap{ display:flex; gap:20px; flex-wrap:wrap; justify-content:space-between; }
  .match-col{ flex:1; min-width:220px; display:flex; flex-direction:column; gap:7px; }
  .match-item{
    padding:8px 11px; border-radius:9px; background:#FFF3D6; cursor:pointer; font-size:14px;
    border:2px solid transparent; transition:.15s;
  }
  .match-item .py-tag{ display:block; font-size:10.5px; color:var(--muted); }
  .match-item.selected{ border-color:var(--accent3); background:#E6F0FF; }
  .match-item.correct{ border-color:var(--accent4); background:#E9FBEA; cursor:default; opacity:.7; }
  .match-item.wrong{ animation:shake .3s; }
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .progress-note{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:6px; }

  /* true/false */
  .tf-item{ background:#FFF9E6; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .tf-item .tf-statement{ font-size:14.5px; margin-bottom:8px; }
  .tf-item .tf-btns{ display:flex; gap:8px; }
  .tf-item button{
    border:2px solid #e0c073; background:#fff; padding:6px 16px; border-radius:16px; font-weight:700; cursor:pointer; font-size:13px;
  }
  .tf-item button.chosen-correct{ background:#E9FBEA; border-color:var(--accent4); }
  .tf-item button.chosen-wrong{ background:#FDEAEA; border-color:var(--accent2); }
  .tf-explain{ margin-top:6px; font-size:12.5px; color:var(--muted); display:none; }
  .tf-explain.show{ display:block; }

  .capstone-title{ font-size:24px; font-weight:800; color:var(--accent2); text-align:center; margin:36px 0 6px; }
  .capstone-sub{ text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:20px; }

  footer{ text-align:center; font-size:12px; color:var(--muted); margin-top:30px; }
</style>
</head>

const TOPICS = [{"short": "Tính từ lặp lại", "title": "1. 形容词重叠 — Tính từ lặp lại", "explain": "So với tính từ ở dạng thông thường, tính từ lặp lại không làm thay đổi ý nghĩa cơ bản, mà chủ yếu dùng để nhấn mạnh mức độ, làm lời nói nhẹ nhàng, tự nhiên và thể hiện sự yêu thích, thân mật. Tính từ đã lặp lại thì không dùng thêm phó từ mức độ 很/非常.", "formula": "Đơn âm tiết: A → AA的 &nbsp; | &nbsp; Song âm tiết: AB → AABB的", "examples": [{"cn": "她的脸红红的。", "py": "Tā de liǎn hónghóng de.", "vn": "Mặt cô ấy đỏ hồng."}, {"cn": "房间里干干净净的。", "py": "Fángjiān lǐ gāngānjìngjìng de.", "vn": "Trong phòng sạch sẽ."}, {"cn": "她每天都漂漂亮亮的。", "py": "Tā měitiān dōu piàopiàoliàngliàng de.", "vn": "Ngày nào cô ấy cũng xinh đẹp."}], "sentence_order": [{"vn": "Con mèo nhỏ có đôi mắt to tròn.", "words": [{"hz": "小猫", "py": "Xiǎomāo"}, {"hz": "的", "py": "de"}, {"hz": "眼睛", "py": "yǎnjīng"}, {"hz": "大大", "py": "dàdà"}, {"hz": "的", "py": "de"}, {"hz": "。", "py": "."}]}, {"vn": "Chúc bạn ngày nào cũng vui vẻ.", "words": [{"hz": "祝", "py": "zhù"}, {"hz": "你", "py": "nǐ"}, {"hz": "每天", "py": "měitiān"}, {"hz": "都", "py": "dōu"}, {"hz": "开开心心", "py": "kāikāixīnxīn"}, {"hz": "的", "py": "de"}, {"hz": "。", "py": "."}]}], "fill_blank": {"bank": ["冷冷", "漂漂亮亮", "胖胖", "高高兴兴"], "items": [{"before": "今天天气", "after": "的。（冷）", "answer": "冷冷", "vn": "Thời tiết hôm nay lành lạnh."}, {"before": "妹妹今天穿得", "after": "的。（漂亮）", "answer": "漂漂亮亮", "vn": "Hôm nay em gái mặc rất xinh xắn."}, {"before": "小狗", "after": "的，很可爱。（胖）", "answer": "胖胖", "vn": "Chú chó con mũm mĩm, rất dễ thương."}, {"before": "孩子们", "after": "地跑进教室。（高兴）", "answer": "高兴", "vn": "Các em bé vui vẻ chạy vào lớp học."}]}, "translate": [{"vn": "Mắt của cô bé to tròn.", "accept": ["她的眼睛大大的"], "py": "Tā de yǎnjīng dàdà de."}]}, {"short": "什么的", "title": "2. 什么的 — Cụm từ cố định \"vân vân\"", "explain": "什么的 là cụm từ cố định đặt ở cuối một danh từ hoặc chuỗi danh từ, biểu thị ý '...vân vân', '...các kiểu'. Dùng khi người nói không muốn/không cần liệt kê hết tất cả sự vật cùng loại.", "formula": "A、B、C + 什么的", "examples": [{"cn": "我喜欢吃芒果、苹果、葡萄什么的。", "py": "Wǒ xǐhuān chī mángguǒ, píngguǒ, pútáo shénme de.", "vn": "Tôi thích ăn xoài, táo, nho các loại."}, {"cn": "桌子上有本子、电脑、笔什么的。", "py": "Zhuōzi shàng yǒu běnzi, diànnǎo, bǐ shénme de.", "vn": "Trên bàn có vở, máy tính, bút các thứ."}], "sentence_order": [{"vn": "Cuối tuần tôi thường xem phim, đọc sách các kiểu.", "words": [{"hz": "周末", "py": "zhōumò"}, {"hz": "我", "py": "wǒ"}, {"hz": "常常", "py": "chángcháng"}, {"hz": "看电影", "py": "kàn diànyǐng"}, {"hz": "、", "py": "、"}, {"hz": "看书", "py": "kàn shū"}, {"hz": "什么的", "py": "shénme de"}, {"hz": "。", "py": "."}]}], "construct": [{"hint": "什么的", "hint_vn": "liệt kê rồi bỏ lửng bằng 什么的", "sample_cn": "妈妈让我买菜、买肉什么的。", "sample_py": "Māma ràng wǒ mǎi cài, mǎi ròu shénme de.", "sample_vn": "Mẹ bảo tôi mua rau, mua thịt các thứ."}], "translate": [{"vn": "Tôi thích ăn táo, chuối và các loại trái cây khác.", "accept": ["我喜欢吃苹果香蕉什么的", "我喜欢吃苹果、香蕉什么的"], "py": "Wǒ xǐhuān chī píngguǒ, xiāngjiāo shénme de."}]}, {"short": "地 (trạng ngữ)", "title": "3. 地 — Trợ từ kết cấu", "explain": "地 (de) dùng để nối trạng ngữ (từ/cụm từ miêu tả cách thức, trạng thái) với động từ, biểu thị hành động được thực hiện như thế nào. Trong tiếng Việt thường hiểu là 'một cách...', '...mà...'.", "formula": "Adj / Cụm adj + 地 + Động từ", "examples": [{"cn": "他认真地学习。", "py": "Tā rènzhēn de xuéxí.", "vn": "Anh ấy học một cách chăm chỉ."}, {"cn": "学生们高兴地回家。", "py": "Xuéshēngmen gāoxìng de huíjiā.", "vn": "Các bạn học sinh vui vẻ về nhà."}, {"cn": "她难过地说：“我要回国了”。", "py": "Tā nánguò de shuō: \"Wǒ yào huíguóle\".", "vn": "Cô ấy buồn bã nói: tớ sắp phải về nước rồi."}], "sentence_order": [{"vn": "Cậu bé buồn bã đi bộ về nhà.", "words": [{"hz": "男孩", "py": "nánhái"}, {"hz": "难过", "py": "nánguò"}, {"hz": "地", "py": "de"}, {"hz": "走路", "py": "zǒulù"}, {"hz": "回家", "py": "huíjiā"}, {"hz": "。", "py": "."}]}, {"vn": "Cô ấy vui vẻ hát lên.", "words": [{"hz": "她", "py": "tā"}, const tocBar = document.getElementById('tocBar');
const mainContent = document.getElementById('mainContent');

TOPICS.forEach((t, idx) => {
  const a = document.createElement('a');
  a.href = `#topic-${idx+1}`;

function renderExplain(container, t){
  const card = document.createElement('div');
  card.className = 'explain-card';
  let html = `<p>${t.explain}</p>`;
  if(t.formula) html += `<div class="formula">${t.formula}</div>`;
  t.examples.forEach(e=>{
    html += `<div class="example-line"><div class="cn">${e.cn}</div><div class="py">${e.py}</div><div class="vn">${e.vn}</div></div>`;
  });
  card.innerHTML = html;
  container.appendChild(card);
}

function renderSentenceOrder(container, exArr, idPrefix){
  if(!exArr || !exArr.length) return;
  const box = document.createElement('div');
  box.className = 'ex-box';
  box.innerHTML = `<h4>🔀 Sắp xếp câu</h4><div class="ex-desc">Bấm vào các từ theo đúng thứ tự để tạo thành câu hoàn chỉnh.</div><div class="sot-container"></div>`;
  container.appendChild(box);
  const sotContainer = box.querySelector('.sot-container');

  exArr.forEach((s, idx)=>{
    const wrap = document.createElement('div');
    wrap.style.marginBottom = '14px';
    wrap.innerHTML = `
      <div style="margin-bottom:5px; color:#8a4b00; font-weight:600; font-size:13.5px;">${s.vn}</div>
      <div class="chip-answer" id="${idPrefix}-answer-${idx}"></div>
      <div class="chip-bank" id="${idPrefix}-bank-${idx}"></div>
      <div class="task-controls">
        <button class="btn" data-action="check" data-idx="${idx}">Kiểm tra</button>
        <button class="btn secondary" data-action="reset" data-idx="${idx}">Làm lại</button>
      </div>
      <div class="feedback" id="${idPrefix}-feedback-${idx}"></div>
    `;
    sotContainer.appendChild(wrap);
    renderBank(idx);
  });

  function renderBank(idx){
    const s = exArr[idx];
    const bank = document.getElementById(`${idPrefix}-bank-${idx}`);
    const answer = document.getElementById(`${idPrefix}-answer-${idx}`);
    bank.innerHTML=''; answer.innerHTML='';
    const shuffled = s.words.map((w,i)=>({...w,origIndex:i})).sort(()=>Math.random()-0.5);
    shuffled.forEach(w=>{
      const chip = document.createElement('div');
      chip.className='chip'; chip.dataset.idx=w.origIndex;
      chip.innerHTML = `${w.hz}<span class="py-tag">${w.py}</span>`;
      chip.addEventListener('click',()=>{
        if(chip.classList.contains('used')) return;
        chip.classList.add('used');
        const ansChip = chip.cloneNode(true);
        ansChip.classList.remove('used');
        ansChip.addEventListener('click',()=>{
          answer.removeChild(ansChip);
          chip.classList.remove('used');
        });
        answer.appendChild(ansChip);
      });
      bank.appendChild(chip);
    });
  }

  sotContainer.addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const idx = parseInt(btn.dataset.idx);
    if(btn.dataset.action==='check'){
      const s = exArr[idx];
      const answer = document.getElementById(`${idPrefix}-answer-${idx}`);
      const chips = [...answer.children].map(c=>parseInt(c.dataset.idx));
      const correct = chips.length===s.words.length && chips.every((v,i)=>v===i);
      const fb = document.getElementById(`${idPrefix}-feedback-${idx}`);
      if(correct){
        fb.textContent = `✅ Chính xác! ${s.words.map(w=>w.hz).join('')}`;
        fb.className='feedback ok';
      } else {
        fb.textContent = `❌ Chưa đúng, thử lại nhé.`;
        fb.className='feedback no';
      }
    } else if(btn.dataset.action==='reset'){
      document.getElementById(`${idPrefix}-feedback-${idx}`).textContent='';
      renderBank(idx);
    }
  });
}

function normalizeCn(s){
  return s.replace(/[，,。.！!？?\s]/g,'');
}

function renderTranslate(container, exArr, idPrefix){
  if(!exArr || !exArr.length) return;
  const box = document.createElement('div');
  box.className = 'ex-box';
  box.innerHTML = `<h4>🌐 Dịch câu</h4><div class="ex-desc">Dịch câu tiếng Việt sau sang tiếng Trung (gõ chữ Hán).</div>`;
  exArr.forEach((item,idx)=>{
    const line = document.createElement('div');
    line.style.marginBottom = '12px';
    line.innerHTML = `
      <div style="font-size:14px; margin-bottom:5px;"><b>VN:</b> ${item.vn}</div>
      <input type="text" id="${idPrefix}-tr-${idx}" placeholder="Nhập câu tiếng Trung...">
      <div class="task-controls">
        <button class="btn" data-tridx="${idx}">Kiểm tra</button>
      </div>
      <div class="feedback" id="${idPrefix}-trfb-${idx}"></div>
    `;
    box.appendChild(line);
  });
  container.appendChild(box);
  box.addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-tridx]');
    if(!btn) return;
    const idx = btn.dataset.tridx;
    const item = exArr[idx];
    const val = normalizeCn(document.getElementById(`${idPrefix}-tr-${idx}`).value.trim());
    const accepted = item.accept.map(normalizeCn);
    const fb = document.getElementById(`${idPrefix}-trfb-${idx}`);
    if(accepted.includes(val)){
      fb.textContent = '✅ Chính xác!';
      fb.className = 'feedback ok';
    } else {
      fb.textContent = `❌ Chưa đúng. Đáp án gợi ý: ${item.accept[0]} (${item.py})`;
      fb.className = 'feedback no';
    }
  });
}

function renderConstruct(container, exArr, idPrefix){
  if(!exArr || !exArr.length) return;
  const box = document.createElement('div');
  box.className = 'ex-box';
  box.innerHTML = `<h4>✍️ Đặt câu với điểm ngữ pháp</h4><div class="ex-desc">Dùng từ/cấu trúc gợi ý để đặt 1 câu hoàn chỉnh của riêng bạn.</div>`;
  exArr.forEach((item,idx)=>{
    const line = document.createElement('div');
    line.style.marginBottom = '12px';
    line.innerHTML = `
      <div style="font-size:14px; margin-bottom:5px;">Gợi ý: <b>${item.hint}</b> — <i>${item.hint_vn}</i></div>
      <textarea id="${idPrefix}-dc-${idx}" rows="2" placeholder="Viết câu của bạn ở đây..."></textarea>
      <div class="task-controls">
        <button class="btn" data-dcidx="${idx}">Xem đáp án mẫu</button>
      </div>
      <div class="sample-answer" id="${idPrefix}-dcsample-${idx}">
        <b>Ví dụ:</b> ${item.sample_cn}<br><span style="color:var(--muted);">${item.sample_py}</span><br>${item.sample_vn}
      </div>
    `;
    box.appendChild(line);
  });
  container.appendChild(box);
  box.addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-dcidx]');
    if(!btn) return;
    document.getElementById(`${idPrefix}-dcsample-${btn.dataset.dcidx}`).classList.toggle('show');
  });
}

function renderFillBlank(container, bank, items, idPrefix){
  if(!items || !items.length) return;
  const box = document.createElement('div');
  box.className = 'ex-box';
  box.innerHTML = `<h4>📝 Điền từ vào chỗ trống</h4><div class="ex-desc">Chọn từ thích hợp trong khung từ cho sẵn để điền vào chỗ trống.</div>`;
  const bankDiv = document.createElement('div');
  bankDiv.className = 'chip-bank';
  bankDiv.style.marginBottom = '10px';
  bank.forEach(w=>{
    const c = document.createElement('div');
    c.className = 'wordbank-chip';
    c.textContent = w;
    bankDiv.appendChild(c);
  });
  box.appendChild(bankDiv);
  items.forEach((item,idx)=>{
    const fi = document.createElement('div');
    fi.className = 'fill-item';
    fi.innerHTML = `
      <div class="fill-sentence">${item.before}<input type="text" id="${idPrefix}-fb-${idx}">${item.after}</div>
      <div class="fill-vn">${item.vn}</div>
      <div class="task-controls">
        <button class="btn" data-fidx="${idx}" data-fanswer="${item.answer}">Kiểm tra</button>
        <span class="feedback" id="${idPrefix}-fbfb-${idx}"></span>
      </div>
    `;
    box.appendChild(fi);
  });
  container.appendChild(box);
  box.addEventListener('click',(e)=>{
    const btn = e.target.closest('button[data-fidx]');
    if(!btn) return;
    const idx = btn.dataset.fidx;
    const val = document.getElementById(`${idPrefix}-fb-${idx}`).value.trim();
    const fb = document.getElementById(`${idPrefix}-fbfb-${idx}`);
    if(val === btn.dataset.fanswer){ fb.textContent='✅'; fb.className='feedback ok'; }
    else { fb.textContent=`❌ (${btn.dataset.fanswer})`; fb.className='feedback no'; }
  });
}

// Render all topics
TOPICS.forEach((t, idx) => {
  const section = document.createElement('div');
  section.className = 'topic-block';
  section.id = `topic-${idx+1}`;
  section.innerHTML = `<div class="topic-num">Điểm ${idx+1}/${TOPICS.length}</div><h2 class="topic-title">${t.title}</h2>`;

  if(t.construct) renderConstruct(section, t.construct, idp+'dc');
  if(t.translate) renderTranslate(section, t.translate, idp+'tr');
});

function buildMatching(leftId, rightId, progressId, data){
  const state = {selLeft:null, selRight:null, correctCount:0};
  const leftCol = document.getElementById(leftId);
  const rightCol = document.getElementById(rightId);
  leftCol.innerHTML=''; rightCol.innerHTML='';
  const dataWithId = data.map((w,i)=>({...w,id:i}));
  const shuffledRight = [...dataWithId].sort(()=>Math.random()-0.5);
  dataWithId.forEach(w=>{
    const el = document.createElement('div');
    el.className='match-item'; el.dataset.id=w.id;
    el.innerHTML = `${w.cn}${w.py ? `<span class="py-tag">${w.py}</span>` : ''}`;
    el.addEventListener('click',()=>selectMatch(el,'left',w.id));
    leftCol.appendChild(el);
  });
  shuffledRight.forEach(w=>{
    const el = document.createElement('div');
    el.className='match-item'; el.dataset.id=w.id;
    el.textContent = w.vn;
    el.addEventListener('click',()=>selectMatch(el,'right',w.id));
    rightCol.appendChild(el);
  });
  document.getElementById(progressId).textContent = `Đã ghép đúng: 0 / ${data.length}`;

  function selectMatch(el, side, id){
    if(el.classList.contains('correct')) return;
    if(side==='left'){
      if(state.selLeft) state.selLeft.classList.remove('selected');
      state.selLeft = el; el.classList.add('selected');
    } else {
      if(state.selRight) state.selRight.classList.remove('selected');
      state.selRight = el; el.classList.add('selected');
    }
    if(state.selLeft && state.selRight){
      const l=state.selLeft, r=state.selRight;
      if(l.dataset.id === r.dataset.id){
        l.classList.add('correct'); r.classList.add('correct');
        l.classList.remove('selected'); r.classList.remove('selected');
        state.correctCount++;
        document.getElementById(progressId).textContent = `Đã ghép đúng: ${state.correctCount} / ${data.length}`;
      } else {
        l.classList.add('wrong'); r.classList.add('wrong');
        setTimeout(()=>{l.classList.remove('wrong','selected'); r.classList.remove('wrong','selected');},400);
      }
      state.selLeft=null; state.selRight=null;
    }
  }
}
buildMatching('capMatchLeft','capMatchRight','capMatchProgress', CAPSTONE_MATCH);
