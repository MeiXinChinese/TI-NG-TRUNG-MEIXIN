<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK3 3.0 · Tiếng Trung Meixin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6D8;
    --ink:#1f2430;
    --ink-soft:#6b7280;
    --red:#E4272A;
    --blue:#2563EB;
    --green:#22A366;
    --gold:#D6A419;
    --line:#EFEFEF;
    --card:#FFFFFF;
    --shadow: 0 8px 22px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Be Vietnam Pro', sans-serif;
    color:var(--ink);
    background:#fff;
  }
  .zh{font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif;}

  header{
    background:#fff;
    padding:22px 26px 20px;
  }
  .back-link{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:14px;
    display:inline-block;
    margin-bottom:6px;
  }
  .back-link:hover{color:var(--ink);}
  .header-main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    text-align:left;
  }
  .logo-img{
    height:64px; width:auto;
    flex:0 0 auto;
  }
  .brand-text .title-row{
    display:flex; align-items:baseline; gap:4px;
  }
  .brand-text h1{
    margin:0; color:var(--red); font-size:34px; font-weight:800;
  }
  .brand-text .sub{
    margin:4px 0 2px; color:var(--ink-soft); font-size:15px;
  }
  .brand-text .meixin{
    font-size:11px; font-weight:700; letter-spacing:1px; color:var(--red);
  }
  .top-bar{ height:5px; background:var(--blue); }

  main{
    background:var(--bg);
    min-height:60vh;
    padding:40px 20px 60px;
  }
  .intro{
    text-align:center;
    color:var(--ink-soft);
    font-size:16px;
    margin-bottom:32px;
  }
  .grid{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:22px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    border-top:5px solid var(--blue);
    box-shadow:var(--shadow);
    padding:22px 22px 20px;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,0.10);
  }
  .card.c-green{border-top-color:var(--green);}
  .card.c-gold{border-top-color:var(--gold);}
  .card.c-red{border-top-color:var(--red);}
  .badge{
    display:inline-block;
    background:#FCEFD1;
    color:#9A6A0A;
    font-weight:700;
    font-size:13px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:14px;
    width:fit-content;
  }
  .card h2{
    font-family:'Noto Sans SC',sans-serif;
    font-size:24px;
    font-weight:800;
    margin:0 0 8px;
    color:var(--ink);
    line-height:1.3;
  }
  .card .py{
    color:var(--blue);
    font-weight:600;
    font-size:14.5px;
    margin-bottom:10px;
  }
  .card .vn{
    color:var(--ink-soft);
    font-size:14.5px;
    margin-bottom:18px;
    flex:1;
  }
  .card .go{
    color:var(--blue);
    font-weight:700;
    font-size:14.5px;
  }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    padding:26px 20px 34px;
    background:var(--bg);
  }
  footer b{color:var(--red); letter-spacing:1px;}

  @media(max-width:560px){
    .header-main{flex-direction:column; text-align:center;}
    .brand-text h1{font-size:28px;}
  }
</style>
</head>
